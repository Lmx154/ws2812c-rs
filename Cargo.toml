[package]
name = "ws2812c"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Driver for the Worldsemi WS2812C-2020 RGB LED: a pure colour and timing core, an SPI transport on embedded-hal, and a PIO transport for embassy-rp"
repository = "https://github.com/Lmx154/ws2812c-rs"
readme = "README.md"
keywords = ["embedded", "no-std", "driver", "ws2812", "led"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.99"

[features]
default = []
defmt = ["dep:defmt", "embassy-rp?/defmt", "embassy-time?/defmt"]
# The PIO transport for embassy-rp. The chip feature (rp235xa/rp235xb) comes from the application.
embassy-rp = ["dep:embassy-rp", "dep:embassy-time"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = { version = "1.0.1", optional = true }
embassy-rp = { version = "0.10.0", default-features = false, optional = true }
embassy-time = { version = "0.5.1", optional = true }

[workspace]
exclude = ["hil"]
